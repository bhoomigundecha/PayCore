spring:
  application:
    name: paycore
  datasource:
    url: ${PAYCORE_DB_URL:jdbc:postgresql://localhost:5432/paycore}
    username: ${PAYCORE_DB_USER:paycore}
    password: ${PAYCORE_DB_PASSWORD:paycore}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${PAYCORE_REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${PAYCORE_KAFKA_BOOTSTRAP:localhost:9092}
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

paycore:
  tigerbeetle:
    cluster-id: 0
    addresses:
      - ${PAYCORE_TIGERBEETLE_ADDRESS:3000}
  fees:
    platform-bps: 200
  recovery:
    interval: 10s
    stuck-after: 30s
